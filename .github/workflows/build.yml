name: Build AA-Proxy SD Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target_board:
        description: 'Select board to build (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - rpi02w
          - radxa03w

jobs:
  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.set-boards.outputs.boards }}
    steps:
      - id: set-boards
        run: |
          CHOICE="${{ github.event.inputs.target_board }}"
          if [ "$CHOICE" = "rpi02w" ]; then
            echo 'boards=["rpi02w"]' >> $GITHUB_OUTPUT
          elif [ "$CHOICE" = "radxa03w" ]; then
            echo 'boards=["radxa03w"]' >> $GITHUB_OUTPUT
          else
            echo 'boards=["rpi02w", "radxa03w"]' >> $GITHUB_OUTPUT
          fi

  build:
    needs: matrix-prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ toJson(fromJson(needs.matrix-prep.outputs.boards)) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost

      - name: Install Buildroot Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses5-dev libssl-dev \
            bison flex libelf-dev bc git rsync unzip cpio \
            python3 device-tree-compiler qemu-user-static

      - name: Build Image for ${{ matrix.board }}
        run: |
          # Use official Buildroot script / docker wrapper
          if [ -f "./docker-dev.sh" ]; then
            ./docker-dev.sh ${{ matrix.board }}
          elif [ -f "./build-image.sh" ]; then
            ./build-image.sh ${{ matrix.board }}
          fi

      - name: Upload SD Card Image
        uses: actions/upload-artifact@v4
        with:
          name: sdcard-${{ matrix.board }}
          path: output/${{ matrix.board }}/images/sdcard.img*
          if-no-files-found: error

