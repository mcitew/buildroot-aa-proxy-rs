name: Build AA-Proxy SD Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target_board:
        description: 'Select board to build'
        required: true
        default: 'rpi02w'
        type: choice
        options:
          - rpi02w
          - radxa03w
          - all

jobs:
  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.set-boards.outputs.boards }}
    steps:
      - id: set-boards
        run: |
          CHOICE="${{ github.event.inputs.target_board }}"
          if [ "$CHOICE" = "rpi02w" ]; then
            echo 'boards=["rpi02w"]' >> $GITHUB_OUTPUT
          elif [ "$CHOICE" = "radxa03w" ]; then
            echo 'boards=["radxa03w"]' >> $GITHUB_OUTPUT
          else
            echo 'boards=["rpi02w", "radxa03w"]' >> $GITHUB_OUTPUT
          fi

  build:
    needs: matrix-prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.matrix-prep.outputs.boards) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true

      - name: Build local Docker environment
        run: |
          docker build -t aaproxybr .

      - name: Build SD Image
        run: |
          chmod +x ./docker-dev.sh
          ./docker-dev.sh ${{ matrix.board }}

      - name: Upload SD Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcard-${{ matrix.board }}
          path: output/${{ matrix.board }}/images/sdcard.img*
          if-no-files-found: ignore

