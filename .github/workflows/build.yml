name: Build AA-Proxy SD Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target_board:
        description: 'Select board to build'
        required: true
        default: 'rpi02w'
        type: choice
        options:
          - rpi02w
          - radxa03w
          - all

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.set-boards.outputs.boards }}
    steps:
      - id: set-boards
        run: |
          CHOICE="${{ github.event.inputs.target_board }}"
          if [ "$CHOICE" = "rpi02w" ]; then
            echo 'boards=["rpi02w"]' >> $GITHUB_OUTPUT
          elif [ "$CHOICE" = "radxa03w" ]; then
            echo 'boards=["radxa03w"]' >> $GITHUB_OUTPUT
          else
            echo 'boards=["rpi02w", "radxa03w"]' >> $GITHUB_OUTPUT
          fi

  build:
    needs: matrix-prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.matrix-prep.outputs.boards) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Maximize Build Storage
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /var/lib/docker || true
          sudo apt-get clean || true

      - name: Prepare Host Directories & Permissions
        run: |
          mkdir -p dl buildroot/dl output/${{ matrix.board }} buildroot/output/${{ matrix.board }}
          sudo chmod -R 777 dl buildroot/dl output buildroot/output || true

      - name: Build Local Container Image
        run: |
          podman build -t aaproxybr .

      - name: Run Buildroot Build
        run: |
          chmod +x ./docker-dev.sh
          ./docker-dev.sh ${{ matrix.board }}

      - name: Compress SD Image (.xz)
        run: |
          echo "Locating uncompressed images for ${{ matrix.board }}..."
          IMG_FILE=$(find output/ buildroot/output/ -name "sdcard.img" | head -n 1)
          
          if [ -n "$IMG_FILE" ]; then
            echo "Found image at $IMG_FILE. Compressing with XZ..."
            xz -v -T0 -9 "$IMG_FILE"
          else
            echo "Warning: Uncompressed sdcard.img not found."
          fi

      - name: Upload SD Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcard-${{ matrix.board }}.img.xz
          path: |
            output/${{ matrix.board }}/images/*.xz
            buildroot/output/${{ matrix.board }}/images/*.xz
          if-no-files-found: error
