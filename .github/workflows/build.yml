name: Build Radxa Zero 3W Image

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6-hour max limit on GitHub Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # Free up disk space on the standard GitHub runner (~14GB free by default)
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          echo "Disk space after cleanup:"
          df -h

      # Cache Buildroot source tarballs (dl/) across runs to save download time
      - name: Cache Buildroot Downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ${{ runner.os }}-buildroot-dl-${{ hashFiles('**/external/**') }}
          restore-keys: |
            ${{ runner.os }}-buildroot-dl-

      # Build the image using your Docker workflow
      - name: Build Radxa Zero 3W Image
        run: |
          chmod +x docker-dev.sh build-image.sh
          ./build-image.sh radxa03w

      # Compress and upload the output image as a downloadable GitHub artifact
      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: radxa03w-sdcard-image
          path: output/images/sdcard.img
          if-no-files-found: error
