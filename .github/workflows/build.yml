name: Build SD images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [ radxa03w ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          echo "Disk space remaining:"
          df -h

      - name: Make Scripts Executable
        run: |
          chmod +x docker-dev.sh || true
          if [ -f build-image.sh ]; then chmod +x build-image.sh; fi

      - name: Build Docker Container
        run: CONTAINER_ENGINE=docker ./docker-dev.sh build

      - name: Build Radxa Zero 3W Image
        run: |
          set -e
          mkdir -p images
          echo "Building board: ${{ matrix.board }}"
          CONTAINER_ENGINE=docker ./docker-dev.sh "${{ matrix.board }}"
          
          # Check output locations
          if [ -d "buildroot/output/radxa03w/images" ]; then path="buildroot/output/radxa03w/images";
          elif [ -d "output/radxa03w/images" ]; then path="output/radxa03w/images";
          elif [ -d "output/images" ]; then path="output/images";
          else path="buildroot/output/images"; fi
          
          echo "Found build output in: $path"
          
          if [ -f "$path/sdcard.img" ]; then
            xz -c "$path/sdcard.img" > images/radxa03w-sdcard.img.xz
          else
            echo "ERROR: sdcard.img not found in $path!"
            ls -la "$path" || true
            exit 1
          fi

      - name: Upload SD-card Artifact
        uses: actions/upload-artifact@v4
        with:
          name: radxa03w-sdcard
          path: images/radxa03w-sdcard.img.xz
          if-no-files-found: error
